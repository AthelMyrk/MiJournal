<title>MurmurTether</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   MurmurTether — Windows XP
   ═══════════════════════════════════════════════════════════ */

:root{
  --xp-surface: #ece9d8;
  --xp-surface-d: #d8d4c0;
  --xp-tb-l: #0831d9;
  --xp-tb-c: #1a8ad8;
  --xp-bar-l: #2a8018;
  --xp-bar-d: #1e6010;
  --xp-blue: #3a78c8;
  --xp-blue-d: #0a5bc4;
  --xp-text: #000;
  --xp-bevel-l: #ffffff;
  --xp-bevel-s: #808080;
  --xp-bevel-deep: #404040;
  --xp-border: #aca899;
  --xp-desktop: #2a6aaa;
  --ease-out-expo: cubic-bezier(0.16,1,0.3,1);
  --ease-soft: cubic-bezier(0.4,0,0.2,1);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;width:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Tahoma','Arial',sans-serif;font-size:11px;color:#000;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  background:var(--xp-desktop);
}

@keyframes fadeIn{from{opacity:0;transform:scale(.96) translateY(4px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}
@keyframes flicker{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
.el-in{animation:fadeIn .5s var(--ease-out-expo) forwards;}

textarea{font-family:inherit;resize:none;outline:none;border:none;}
input[type=range]{-webkit-appearance:none;height:14px;background:transparent;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#fff;border-top:1px solid #808080;border-left:1px solid #808080;border-right:1px solid #fff;border-bottom:1px solid #fff;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;background:linear-gradient(180deg,#fafaf2,#dcd8c0);border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #808080;border-bottom:1px solid #808080;cursor:pointer;margin-top:-7px;}
input[type=color]{-webkit-appearance:none;border:none;padding:0;cursor:pointer;width:24px;height:24px;background:none;}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border-top:1px solid #808080;border-left:1px solid #808080;border-right:1px solid #fff;border-bottom:1px solid #fff;}
::-webkit-scrollbar{width:16px;height:16px;}
::-webkit-scrollbar-track{background:#dfdcc4;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#f4f2e8,#cac6a8);border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #808080;border-bottom:1px solid #808080;}

/* ── Board (root XP window) ── */
.board{position:relative;width:100%;height:100%;overflow:hidden;background:var(--xp-desktop);display:flex;flex-direction:column;outline:1px solid #0a0a0a;outline-offset:-1px;}

/* ── Titlebar ── */
.xp-titlebar{
  height:30px;flex-shrink:0;
  background:linear-gradient(180deg,#1a5bc8 0%,#1a8ad8 4%,#0a72d8 47%,#0a72d8 53%,#1a8ad8 90%,#0831a8 100%);
  border-bottom:1px solid #0831d9;
  display:flex;align-items:center;padding:2px 4px;color:#fff;
  font-weight:bold;font-size:12px;text-shadow:1px 1px 2px rgba(0,0,0,.5);
  user-select:none;flex-shrink:0;
}
.xp-tb-icon{width:18px;height:18px;margin:0 4px;flex-shrink:0;}
.xp-tb-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xp-tb-controls{display:flex;gap:2px;flex-shrink:0;}
.xp-tb-btn{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#5a92e4,#0a5bc4);
  border-top:1px solid rgba(255,255,255,.6);border-left:1px solid rgba(255,255,255,.5);
  border-right:1px solid #0a3a98;border-bottom:1px solid #0a3a98;
  color:#fff;cursor:pointer;font-family:'Tahoma',sans-serif;font-size:11px;
  font-weight:bold;line-height:1;padding:0;
}
.xp-tb-btn:hover{background:linear-gradient(180deg,#7aa8e8,#2a78c8);}
.xp-tb-btn:active{background:linear-gradient(180deg,#0a3a98,#5a92e4);}
.xp-tb-btn.close{background:linear-gradient(180deg,#e88068,#c82a18);border-color:rgba(255,255,255,.5) #80100a #80100a rgba(255,255,255,.4);}
.xp-tb-btn.close:hover{background:linear-gradient(180deg,#f0a088,#e04a30);}

/* ── Menubar ── */
.xp-menubar{
  height:24px;flex-shrink:0;background:var(--xp-surface);
  border-bottom:1px solid var(--xp-border);
  display:flex;align-items:center;padding:0 4px;font-size:11px;
}
.xp-menu-item{
  padding:4px 9px;cursor:pointer;color:#000;border:1px solid transparent;
  user-select:none;background:transparent;font-family:inherit;
}
.xp-menu-item:hover,.xp-menu-item.active{
  background:linear-gradient(180deg,#3a90e8,#1a68c8);color:#fff;
  border-top:1px solid #5aaff8;border-left:1px solid #5aaff8;
  border-right:1px solid #0a3a98;border-bottom:1px solid #0a3a98;
}

/* ── Toolbar ── */
.xp-toolbar{
  flex-shrink:0;background:linear-gradient(180deg,#f4f2e8,#e0dcc8);
  border-bottom:1px solid var(--xp-border);box-shadow:0 1px 0 #fff inset;
  display:flex;align-items:center;padding:4px 6px;gap:3px;
  min-height:36px;flex-wrap:wrap;
}
.xp-tb-sep{width:0;height:24px;border-left:1px solid #808080;border-right:1px solid #fff;margin:0 4px;flex-shrink:0;}
.xp-toolbar .day-label{font-family:'Tahoma',sans-serif;font-size:11px;color:#000;padding:0 8px;min-width:90px;text-align:center;}

.xp-btn{
  height:28px;padding:0 9px;display:flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#fafaf2,#dcd8c0);
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  font-family:inherit;font-size:11px;color:#000;cursor:pointer;
  white-space:nowrap;user-select:none;
}
.xp-btn:hover{background:linear-gradient(180deg,#ffffff,#e8e4d0);}
.xp-btn:active,.xp-btn.active{
  background:linear-gradient(180deg,#dcd8c0,#fafaf2);
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
}
.xp-btn:disabled{opacity:.5;cursor:default;}
.xp-btn-icon{width:30px;padding:0;justify-content:center;}
.xp-btn .icon{width:14px;height:14px;color:#000;stroke:#000;}
.xp-spacer{flex:1;}

/* ── Canvas area ── */
.xp-canvas-area{
  flex:1;position:relative;overflow:hidden;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  background:#cae5f0;
}
.xp-canvas-area.dark{background:#03050a;}

/* ── Statusbar ── */
.xp-statusbar{
  height:22px;flex-shrink:0;
  background:linear-gradient(180deg,#ece9d8,#d8d4c0);
  border-top:1px solid #fff;
  display:flex;align-items:center;padding:2px 4px;gap:3px;font-size:11px;color:#000;
}
.xp-status-panel{
  height:18px;padding:0 7px;display:flex;align-items:center;gap:6px;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  background:var(--xp-surface);
}
.xp-status-panel.flex{flex:1;}
.xp-status-panel button{background:none;border:none;cursor:pointer;color:#000;font-family:inherit;font-size:11px;padding:0 2px;}
.xp-status-panel button:hover{color:#0a5bc4;}

/* ── Taskbar ── */
.xp-taskbar{
  height:30px;flex-shrink:0;
  background:linear-gradient(180deg,#3a8a18 0%,#2a8018 6%,#1e6010 92%,#0e4008 100%);
  border-top:1px solid #4aaa28;
  display:flex;align-items:center;padding:0;gap:0;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset;
}
.xp-start-btn{
  height:30px;padding:0 18px 0 6px;
  background:linear-gradient(180deg,#5aaa2a 0%,#3a8808 50%,#2a6808 100%);
  border:none;border-radius:0 14px 14px 0;
  display:flex;align-items:center;gap:6px;cursor:pointer;color:#fff;
  font-weight:bold;font-style:italic;font-size:13px;font-family:'Tahoma',sans-serif;
  text-shadow:1px 1px 2px rgba(0,0,0,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,0,.25),1px 0 0 rgba(0,0,0,.4);
}
.xp-start-btn:hover{filter:brightness(1.08);}
.xp-start-orb{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#fff8a0 0%,#ffe040 30%,#ff8000 70%,#a02000 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.3),inset 1px 1px 2px rgba(255,255,255,.5);
}
.xp-task-spacer{flex:1;display:flex;align-items:center;padding:0 6px;gap:3px;overflow:hidden;}
.xp-task-btn{
  height:24px;padding:0 10px;
  background:linear-gradient(180deg,#3a8a18,#2a6808);
  border-top:1px solid #4aaa28;border-left:1px solid #4aaa28;
  border-right:1px solid #1a4008;border-bottom:1px solid #1a4008;
  color:#fff;font-size:11px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;gap:5px;max-width:200px;
  text-shadow:1px 1px 1px rgba(0,0,0,.3);
}
.xp-task-btn.active{
  background:linear-gradient(180deg,#1e5008,#3a8a18);
  border-top:1px solid #1a4008;border-left:1px solid #1a4008;
  border-right:1px solid #4aaa28;border-bottom:1px solid #4aaa28;
}
.xp-systray{
  height:30px;padding:0 8px;
  background:linear-gradient(180deg,#0e4008,#1e6010,#0e4008);
  display:flex;align-items:center;gap:8px;color:#fff;font-size:11px;
  text-shadow:1px 1px 1px rgba(0,0,0,.3);
  box-shadow:inset 1px 0 0 rgba(0,0,0,.4),inset 2px 0 0 rgba(74,170,40,.3);
  border-left:1px solid #1a4008;
  flex-shrink:0;
}

/* ── Canvas ── */
.canvas-viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;z-index:2;}
.canvas-viewport.panning{cursor:grabbing;}
.canvas-world{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;will-change:transform;overflow:visible;}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.bg-wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .4s ease;pointer-events:none;z-index:1;}

/* ── Board elements ── */
.board-el{position:absolute;cursor:grab;user-select:none;transition:filter .2s;}
.board-el:hover{filter:brightness(1.03);z-index:100 !important;}
.board-el:active{cursor:grabbing;}
.del-btn{
  position:absolute;top:-7px;right:-7px;width:18px;height:18px;
  background:linear-gradient(180deg,#e88068,#c82a18);
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #80100a;border-bottom:1px solid #80100a;
  color:#fff;display:none;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;font-size:11px;font-weight:bold;line-height:1;
  box-shadow:1px 1px 2px rgba(0,0,0,.4);font-family:'Tahoma',sans-serif;
}
.del-btn:hover{background:linear-gradient(180deg,#f0a088,#e04a30);}
.board-el:hover .del-btn{display:flex;}
.resize-handle{
  position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;
  opacity:0;transition:opacity .2s;
}
.board-el:hover .resize-handle{opacity:.7;}
.resize-handle::after{
  content:'';position:absolute;bottom:2px;right:2px;width:10px;height:10px;
  background-image:linear-gradient(135deg,transparent 0,transparent 35%,#808080 35%,#808080 50%,transparent 50%,transparent 75%,#808080 75%,#808080 90%,transparent 90%);
}

/* ── Postit ── */
.postit{
  padding:0;width:100%;height:100%;display:flex;flex-direction:column;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  box-shadow:1px 1px 0 #404040,3px 3px 8px rgba(0,0,0,.3);
  position:relative;
}
.postit:hover{outline:2px solid #0a5bc4;outline-offset:0;}
.postit-author{
  font-family:'Tahoma',sans-serif;font-size:10px;font-weight:bold;
  padding:5px 10px;
  border-bottom:1px solid #808080;box-shadow:0 1px 0 #fff;margin-bottom:0;
  background:rgba(255,255,255,.25);
  color:rgba(0,0,0,.8);
}
.postit-body{padding:10px 12px 8px;flex:1;display:flex;flex-direction:column;}
.postit-text{font-size:13px;line-height:1.5;word-break:break-word;flex:1;}
.postit-time{font-family:'DM Mono',monospace;font-size:9px;opacity:.55;margin-top:6px;text-align:right;letter-spacing:.04em;}

/* ── Sketch ── */
.sketch{
  background:#fff;padding:6px;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  box-shadow:1px 1px 0 #404040,3px 3px 8px rgba(0,0,0,.3);
  position:relative;
}
.sketch.dark-sheet{background:#1a1c20;}
.sketch::before{
  content:'';position:absolute;left:6px;top:6px;right:6px;bottom:6px;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  pointer-events:none;
}
.sketch-author{position:absolute;top:10px;left:14px;font-size:10px;font-weight:bold;color:#000;font-family:'Tahoma',sans-serif;background:rgba(255,255,255,.7);padding:1px 4px;}
.sketch.dark-sheet .sketch-author{color:#fff;background:rgba(0,0,0,.5);}
.sketch-time{position:absolute;bottom:10px;right:14px;font-size:9px;opacity:.65;font-family:'DM Mono',monospace;background:rgba(255,255,255,.7);padding:1px 4px;}
.sketch.dark-sheet .sketch-time{color:#fff;background:rgba(0,0,0,.5);}
.sketch img{display:block;width:100%;height:100%;}

/* ── Polaroid ── */
.polaroid{
  background:#fff;padding:8px 8px 0;display:flex;flex-direction:column;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  box-shadow:2px 2px 0 #404040,4px 4px 10px rgba(0,0,0,.35);
}
.polaroid-img{
  flex:1;overflow:hidden;background:#000;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
}
.polaroid-img img{width:100%;height:100%;object-fit:cover;display:block;}
.polaroid-foot{padding:8px 4px 12px;}
.polaroid-caption{font-family:'Caveat',cursive;font-size:14px;color:#1a1a1a;text-align:center;border:none;outline:none;width:100%;background:transparent;}
.polaroid-caption::placeholder{color:#bbb;}
.polaroid-meta{font-family:'DM Mono',monospace;font-size:9px;color:#777;text-align:right;margin-top:4px;}

/* ── Modals (XP secondary windows) ── */
.overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.35);
  animation:overlayIn .25s ease;
}
body:has(.overlay) .board-el:hover{z-index:auto !important;}
.modal{
  background:var(--xp-surface);
  outline:1px solid #0a0a0a;
  width:100%;max-width:420px;
  display:flex;flex-direction:column;
  box-shadow:4px 4px 14px rgba(0,0,0,.45);
  animation:modalIn .3s var(--ease-out-expo);
  font-size:11px;
}
.modal .xp-titlebar{height:26px;font-size:12px;}
.modal h3{font-family:'Tahoma',sans-serif;font-weight:bold;font-size:12px;color:#fff;flex:1;}
.modal-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:11px;}
.modal-close{
  width:22px;height:22px;
  background:linear-gradient(180deg,#e88068,#c82a18);
  border-top:1px solid rgba(255,255,255,.6);border-left:1px solid rgba(255,255,255,.5);
  border-right:1px solid #80100a;border-bottom:1px solid #80100a;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'Tahoma',sans-serif;font-weight:bold;font-size:11px;line-height:1;padding:0;
}
.modal-close:hover{background:linear-gradient(180deg,#f0a088,#e04a30);}

.minput{
  width:100%;padding:5px 7px;font-family:inherit;font-size:11px;
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
  background:#fff;color:#000;outline:none;
}
.minput:focus{outline:1px dotted #404040;outline-offset:-3px;}

.mrow{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.mbtn{
  min-width:75px;height:24px;padding:0 14px;
  background:linear-gradient(180deg,#fafaf2,#dcd8c0);
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  font-family:inherit;font-size:11px;color:#000;cursor:pointer;
}
.mbtn:hover:not(:disabled){background:linear-gradient(180deg,#fff,#e8e4d0);}
.mbtn:active{
  background:linear-gradient(180deg,#dcd8c0,#fafaf2);
  border-top:1px solid #808080;border-left:1px solid #808080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
}
.mbtn:disabled{opacity:.5;cursor:default;}
.mbtn.primary{font-weight:bold;outline:1px dotted #404040;outline-offset:-4px;}

.mlabel{font-family:'Tahoma',sans-serif;font-size:11px;color:#000;margin-bottom:3px;display:block;}
.font-row{display:flex;gap:3px;flex-wrap:wrap;}
.fpill{
  padding:3px 8px;font-size:10px;cursor:pointer;
  background:linear-gradient(180deg,#fafaf2,#dcd8c0);
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  font-family:inherit;color:#000;
}
.fpill:hover{background:linear-gradient(180deg,#fff,#e8e4d0);}
.fpill.active{
  background:#316ac5;color:#fff;
  border-top:1px solid #1a4080;border-left:1px solid #1a4080;
  border-right:1px solid #fff;border-bottom:1px solid #fff;
}

.color-row{display:flex;gap:5px;flex-wrap:wrap;}
.cdot{
  width:24px;height:24px;cursor:pointer;border-radius:0;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-right:1px solid #808080;border-bottom:1px solid #808080;
  box-shadow:none;
}
.cdot.active{outline:2px solid #0a5bc4;outline-offset:1px;}

.iurl{
  padding:6px 8px;font-family:'DM Mono',monospace;font-size:11px;
  word-break:break-all;user-select:all;background:#fff;color:#000;
  border-top:1px solid #808080;border-left:1px solid #808080;

// Y2K filter
// ═══════════════════════════════════════════════════════════
const applyY2K=(canvas,src)=>new Promise(res=>{
  const img=new Image();
  img.onload=()=>{
    const W=310,H=Math.round(310*(img.height/img.width));
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,W,H);
    const id=ctx.getImageData(0,0,W,H);const d=id.data;
    for(let i=0;i<d.length;i+=4){
      d[i]=Math.min(255,d[i]*.88+18);d[i+1]=Math.min(255,d[i+1]*.95+14);d[i+2]=Math.min(255,d[i+2]*1.07+10);
      const n=(Math.random()-.5)*28;d[i]+=n;d[i+1]+=n;d[i+2]+=n;
    }
    ctx.putImageData(id,0,0);
    const vg=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,.04)';for(let y=0;y<H;y+=2)ctx.fillRect(0,y,W,1);
    ctx.fillStyle='rgba(255,200,50,.8)';ctx.font='bold 10px monospace';
    const now=new Date();ctx.fillText(`${String(now.getMonth()+1).padStart(2,'0')}/${now.getDate()}/${now.getFullYear()}`,W-76,H-8);
    res(canvas.toDataURL('image/jpeg',.72));
  };
  img.src=src;
});

          key={'snow2-'+i}
          points={`${x},${y} ${x-12},${y+20} ${x+12},${y+20}`}
          fill={isDark?'#506880':'#fafcff'}
          opacity={isDark?.55:.85}
        />
      ))}

      {/* Árboles pequeños en la base (al pie de la cordillera) */}
      {Array.from({length:32}).map((_,i)=>{
        const x=(i*39+8)%1200,baseY=700+(i%5)*16,h=11+(i%4)*3;
        return(
          <g key={'tree-'+i}>
            <rect x={x-1.2} y={baseY+h*0.7} width="2.4" height={h*0.35} fill={isDark?'#020404':'#3a2810'}/>
            <polygon
              points={`${x},${baseY} ${x-h*0.55},${baseY+h*0.78} ${x+h*0.55},${baseY+h*0.78}`}
              fill={isDark?'#020610':'#1e5018'}
            />
          </g>
        );
      })}
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════
// Draw Modal
// ═══════════════════════════════════════════════════════════
function DrawModal({onSave,onCancel,isDark}){
  const ref=useRef(null);
  const [tool,setTool]=useState('pen');
  const [color,setColor]=useState(isDark?'#e8e8ec':'#1a1a1a');
  const [sz,setSz]=useState(3);
  const drawing=useRef(false);
  const last=useRef(null);

  useEffect(()=>{
    const c=ref.current,ctx=c.getContext('2d');
    ctx.fillStyle=isDark?'#1a1c20':'#fafaf6';
    ctx.fillRect(0,0,c.width,c.height);
  },[]);

  const getPos=(e,c)=>{
    const r=c.getBoundingClientRect();
    const s=e.touches?e.touches[0]:e;
    return{x:(s.clientX-r.left)*(c.width/r.width),y:(s.clientY-r.top)*(c.height/r.height)};
  };
  const spray=(ctx,p)=>{
    ctx.fillStyle=color;
    for(let i=0;i<18;i++){const r=sz*4,x=p.x+(Math.random()-.5)*r*2,y=p.y+(Math.random()-.5)*r*2;if(Math.hypot(x-p.x,y-p.y)<r)ctx.fillRect(x,y,1.5,1.5);}
  };
  const onDown=e=>{e.preventDefault();drawing.current=true;const c=ref.current,p=getPos(e,c);last.current=p;if(tool==='spray')spray(c.getContext('2d'),p);};
  const onMove=e=>{
    if(!drawing.current)return;e.preventDefault();
    const c=ref.current,ctx=c.getContext('2d'),p=getPos(e,c);
    if(tool==='pen'||tool==='eraser'){
      ctx.beginPath();ctx.moveTo(last.current.x,last.current.y);ctx.lineTo(p.x,p.y);
      ctx.strokeStyle=tool==='eraser'?(isDark?'#1a1c20':'#fafaf6'):color;
      ctx.lineWidth=tool==='eraser'?sz*4:sz;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();last.current=p;
    }else if(tool==='spray'){spray(ctx,p);last.current=p;}
  };
  const onUp=e=>{
    if(!drawing.current)return;e.preventDefault();
    const c=ref.current,ctx=c.getContext('2d'),p=getPos(e,c),l=last.current;
    if(tool==='rect'){ctx.strokeStyle=color;ctx.lineWidth=sz;ctx.strokeRect(l.x,l.y,p.x-l.x,p.y-l.y);}
    else if(tool==='line'){ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=color;ctx.lineWidth=sz;ctx.lineCap='round';ctx.stroke();}
    else if(tool==='circle'){const rx=Math.abs(p.x-l.x)/2,ry=Math.abs(p.y-l.y)/2;ctx.strokeStyle=color;ctx.lineWidth=sz;ctx.beginPath();ctx.ellipse(l.x+(p.x>l.x?rx:-rx),l.y+(p.y>l.y?ry:-ry),rx,ry,0,0,Math.PI*2);ctx.stroke();}
    drawing.current=false;
  };
  const TOOLS=[{id:'pen',I:Icon.Pencil},{id:'eraser',I:Icon.Eraser},{id:'spray',I:Icon.Spray},{id:'line',I:Icon.Line},{id:'rect',I:Icon.Rect},{id:'circle',I:Icon.Circle}];
  return(
    <div className="overlay">
      <div className="modal" style={{maxWidth:540}}>
        <div className="xp-titlebar">
          <Icon.Logo className="xp-tb-icon" style={{color:'#ffe040'}}/>
          <h3>Nueva hoja — Paint</h3>
          <div className="xp-tb-controls">
            <button className="modal-close" onClick={onCancel}>×</button>
          </div>
        </div>
        <div className="modal-body">
        <div className="dtoolbar">
          <div style={{display:'flex',gap:4}}>
            {TOOLS.map(({id,I})=>(
              <button key={id} className={`dtool${tool===id?' active':''}`} onClick={()=>setTool(id)}><I className="icon"/></button>
            ))}
          </div>
          <input type="color" value={color} onChange={e=>setColor(e.target.value)}/>
          <div style={{display:'flex',alignItems:'center',gap:10,flex:1}}>
            <span style={{fontFamily:"'Tahoma',sans-serif",fontSize:11,color:'#000',whiteSpace:'nowrap'}}>Grosor:</span>
            <input type="range" min="1" max="18" value={sz} onChange={e=>setSz(+e.target.value)} style={{flex:1}}/>
          </div>
        </div>
        <canvas ref={ref} width={480} height={300}
          style={{width:'100%',borderRadius:10,border:'1px solid rgba(255,255,255,.08)',cursor:tool==='eraser'?'cell':'crosshair',touchAction:'none',display:'block',boxShadow:'inset 0 1px 2px rgba(0,0,0,0.3)'}}
          onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
          onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}/>
        <div className="mrow">
          <button className="mbtn" onClick={onCancel}>Cancelar</button>
          <button className="mbtn primary" onClick={()=>{
            const c=ref.current;
            const tmp=document.createElement('canvas');
            tmp.width=400;tmp.height=Math.round(400*(c.height/c.width));
            tmp.getContext('2d').drawImage(c,0,0,tmp.width,tmp.height);
            onSave(tmp.toDataURL('image/jpeg',0.78));
          }}>Poner en tablón</button>
        </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// Board Element
// ═══════════════════════════════════════════════════════════
function BoardEl({el,onMove,onDelete,onUpdateCaption,onPress,scale}){
  const elRef=useRef(null);
  const dragStart=useRef(null);
  const resizeStart=useRef(null);

  const startDrag=useCallback((e)=>{
    if(e.target.closest('.resize-handle')||e.target.closest('.del-btn')||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.touches&&e.touches.length>1)return;
    e.preventDefault();
    e.stopPropagation();
    onPress&&onPress(el.id);
    const s=e.touches?e.touches[0]:e;
    dragStart.current={mx:s.clientX,my:s.clientY,ex:el.x,ey:el.y};
    const move=ev=>{
      if(ev.touches&&ev.touches.length>1)return;
      const m=ev.touches?ev.touches[0]:ev;
      const dx=(m.clientX-dragStart.current.mx)/scale;
      const dy=(m.clientY-dragStart.current.my)/scale;
      onMove(el.id,Math.round(dragStart.current.ex+dx),Math.round(dragStart.current.ey+dy));
    };
    const up=()=>{
      document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
      document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    };
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
  },[el,onMove,scale,onPress]);

  const startResize=useCallback((e)=>{
    e.preventDefault();e.stopPropagation();
    if(e.touches&&e.touches.length>1)return;
    const s=e.touches?e.touches[0]:e;
    // Buscar el div visual y leer su tamaño REAL actual como base
    const visual=elRef.current?.querySelector('.postit,.sketch,.polaroid');
    const rect=visual?.getBoundingClientRect();
    const initW=el.w||(rect?Math.round(rect.width/scale):220);
    const initH=el.h||(rect?Math.round(rect.height/scale):200);
    resizeStart.current={mx:s.clientX,my:s.clientY,w:initW,h:initH};
    let curW=initW,curH=initH;
    const move=ev=>{
      if(ev.touches&&ev.touches.length>1)return;
      ev.preventDefault();
      const m=ev.touches?ev.touches[0]:ev;
      const dx=(m.clientX-resizeStart.current.mx)/scale;
      const dy=(m.clientY-resizeStart.current.my)/scale;
      curW=Math.max(120,resizeStart.current.w+dx);
      curH=Math.max(100,resizeStart.current.h+dy);
      // Sólo DOM, sin tocar state ni DB durante el drag
      if(visual){visual.style.width=curW+'px';visual.style.height=curH+'px';}
    };
    const up=()=>{
      document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
      document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
      // Persistir SOLO al soltar
      if(curW!==initW||curH!==initH){onMove(el.id,el.x,el.y,curW,curH);}
    };
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
  },[el,onMove,scale]);

  const rot=el.rot||0;
  const style={left:el.x,top:el.y,transform:`rotate(${rot}deg)`,zIndex:el.z||1};

  if(el.type==='postit'){
    const bgColor=PCOLORS.find(c=>c.id===el.color)?.v||el.color||'#fefcf0';
    const font=FONTS.find(f=>f.id===el.font)||FONTS[4];
    const w=el.w||220;
    const dark=luminance(bgColor)<.55;
    const tc=dark?'rgba(255,255,255,.88)':'rgba(20,20,20,.82)';
    return(
      <div ref={elRef} className="board-el el-in" style={style}
        onMouseDown={startDrag} onTouchStart={startDrag}>
        <button className="del-btn" onClick={()=>onDelete(el.id)}><Icon.X className="icon-sm"/></button>
        <div className="postit" style={{background:bgColor,fontFamily:font.css,width:w,height:el.h||'auto',overflow:'hidden',color:tc}}>
          <div className="postit-author" style={{color:dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.78)',background:dark?'rgba(0,0,0,.18)':'rgba(255,255,255,.35)'}}>{el.author_name||'anónimo'}</div>
          <div className="postit-body">
            <div className="postit-text" style={{fontSize:el.font==='caveat'?'1.15rem':'13.5px',fontStyle:['cormorant','lora'].includes(el.font)?'italic':'normal'}}>{el.content}</div>
            <div className="postit-time">{new Date(el.created_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>
        <div className="resize-handle" onMouseDown={startResize} onTouchStart={startResize} style={{color:dark?'rgba(255,255,255,.4)':'rgba(0,0,0,.4)'}}/>
      </div>
    );
  }

  if(el.type==='sketch'){
    const w=el.w||240,h=el.h||180;
    return(
      <div ref={elRef} className="board-el el-in" style={style}
        onMouseDown={startDrag} onTouchStart={startDrag}>
        <button className="del-btn" onClick={()=>onDelete(el.id)}><Icon.X className="icon-sm"/></button>
        <div className={`sketch${getIsDark()?' dark-sheet':''}`} style={{width:w,height:h}}>
          <div className="sketch-author">{el.author_name||'anónimo'}</div>
          <img src={el.content} alt="" style={{objectFit:'contain'}}/>
          <div className="sketch-time">{new Date(el.created_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div className="resize-handle" onMouseDown={startResize} onTouchStart={startResize} style={{color:'rgba(0,0,0,.4)'}}/>
      </div>
    );
  }

  if(el.type==='polaroid'){
    const w=el.w||190,imgH=Math.round(w*.95);
    return(
      <div ref={elRef} className="board-el el-in" style={style}
        onMouseDown={startDrag} onTouchStart={startDrag}>
        <button className="del-btn" onClick={()=>onDelete(el.id)}><Icon.X className="icon-sm"/></button>
        <div className="polaroid" style={{width:w}}>
          <div className="polaroid-img" style={{height:imgH}}>
            <img src={el.content} alt=""/>
          </div>
          <div className="polaroid-foot">
            <input className="polaroid-caption" defaultValue={el.caption||''} placeholder="..."
              onBlur={e=>onUpdateCaption(el.id,e.target.value)}
              onMouseDown={e=>e.stopPropagation()} onTouchStart={e=>e.stopPropagation()}/>
            <div className="polaroid-meta">{el.author_name} · {new Date(el.created_at).toLocaleDateString('es',{day:'numeric',month:'short'})}</div>
          </div>
        </div>
        <div className="resize-handle" onMouseDown={startResize} onTouchStart={startResize} style={{color:'rgba(0,0,0,.3)'}}/>
      </div>
    );
  }
  return null;
}

// ═══════════════════════════════════════════════════════════
// Onboarding
// ═══════════════════════════════════════════════════════════
function Onboarding({onDone}){
  const [step,setStep]=useState('choice');
  const [name,setName]=useState('');
  const [code,setCode]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');

  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const room=params.get('room');
    if(room){setCode(room);setStep('join');}
  },[]);

  const create=async()=>{
    if(!name.trim())return setErr('Ponete un apodo primero');
    setLoading(true);setErr('');
    const roomId='mt_'+Math.random().toString(36).slice(2,9);
    const userId='u_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
    const{error}=await sb.from('murmur_rooms').insert({id:roomId,created_by:userId,members:[{id:userId,name:name.trim()}]});
    if(error){setErr('Error al crear sala.');setLoading(false);return;}
    ls.set('userId',userId);ls.set('userName',name.trim());ls.set('roomId',roomId);
    onDone({userId,userName:name.trim(),roomId});
  };

  const join=async()=>{
    if(!name.trim())return setErr('Ponete un apodo primero');
    if(!code.trim())return setErr('Pegá el link o código');
    setLoading(true);setErr('');
    const roomId=code.trim().includes('room=')?new URLSearchParams(code.trim().split('?')[1]).get('room'):code.trim();
    const{data,error}=await sb.from('murmur_rooms').select('*').eq('id',roomId).single();
    if(error||!data){setErr('Sala no encontrada.');setLoading(false);return;}
    const userId='u_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
    await sb.from('murmur_rooms').update({members:[...(data.members||[]),{id:userId,name:name.trim()}]}).eq('id',roomId);
    ls.set('userId',userId);ls.set('userName',name.trim());ls.set('roomId',roomId);
    onDone({userId,userName:name.trim(),roomId});
  };

  return(
    <div className="onboard">
      <div className="ocard">
        <div className="xp-titlebar">
          <svg className="xp-tb-icon" viewBox="0 0 32 32" style={{color:'#ffe040'}}><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" strokeWidth="2"/><circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" strokeWidth="2"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg>
          <h3>MurmurTether — Bienvenido</h3>
          <div className="xp-tb-controls">
            <button className="xp-tb-btn close" disabled style={{opacity:.5}}>×</button>
          </div>
        </div>
        <div className="ocard-body">
          <div className="obrand">
            <svg className="obrand-mark" viewBox="0 0 32 32" style={{color:'#ff8000'}}>
              <defs><radialGradient id="ob-orb" cx="35%" cy="30%" r="70%"><stop offset="0%" stopColor="#fff8a0"/><stop offset="40%" stopColor="#ffe040"/><stop offset="80%" stopColor="#ff8000"/><stop offset="100%" stopColor="#a02000"/></radialGradient></defs>
              <circle cx="16" cy="16" r="13" fill="none" stroke="#3a8a08" strokeWidth="1" opacity=".6"/>
              <circle cx="16" cy="16" r="9.5" fill="none" stroke="#3a8a08" strokeWidth="1.4" opacity=".75"/>
              <circle cx="16" cy="16" r="6" fill="url(#ob-orb)"/>
            </svg>
            <div className="otitle">MurmurTether</div>
            <div className="osub">un tablón para los dos</div>
          </div>
          {step==='choice'&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <button className="obtn primary" onClick={()=>setStep('create')}>Crear tablón nuevo</button>
              <button className="obtn" onClick={()=>setStep('join')}>Unirme con un link</button>
            </div>
          )}
          {(step==='create'||step==='join')&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div>
                <label className="olabel">Tu apodo</label>
                <input className="oinput" value={name} onChange={e=>setName(e.target.value)} placeholder="¿cómo te llaman acá?" autoFocus/>
              </div>
              {step==='join'&&(
                <div>
                  <label className="olabel">Link de invitación</label>
                  <input className="oinput" value={code} onChange={e=>setCode(e.target.value)} placeholder="pegá el link aquí"/>
                </div>
              )}
              {err&&<p className="oerr">{err}</p>}
              <div className="mrow" style={{justifyContent:'space-between',alignItems:'center'}}>
                <button className="oback" onClick={()=>{setStep('choice');setErr('');}}>← volver</button>
                <button className="obtn primary" onClick={step==='create'?create:join} disabled={loading} style={{opacity:loading?.6:1}}>
                  {loading?'un momento...':(step==='create'?'Crear tablón':'Entrar')}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
